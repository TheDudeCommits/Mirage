networks:
  web_net:
    external: true
services:
  askmira-textdetect:
    image: docker.cache.whaleintel.me/askmira-textdetect:latest
    container_name: askmira-textdetect
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_net"
      - "traefik.http.routers.askmira-textdetect.entrypoints=http"
      - "traefik.http.routers.askmira-textdetect.rule=Host(`${traefik_host_rule}`)"
      - "traefik.http.routers.askmira-textdetect.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.askmira-textdetect-secure.entrypoints=https"
      - "traefik.http.routers.askmira-textdetect-secure.rule=Host(`${traefik_host_rule}`)"
      - "traefik.http.routers.askmira-textdetect-secure.tls=true"
      - "traefik.http.routers.askmira-textdetect-secure.tls.options=default"
      - "traefik.http.routers.askmira-textdetect-secure.tls.certresolver=mycert"
      - "traefik.http.services.askmira-textdetect.loadbalancer.server.port=3000"
    restart: always
    networks:
      - web_net
