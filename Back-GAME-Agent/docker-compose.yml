version: '3.8'

services:
  game-agent:
    build: .
    container_name: game-agent-twitter-verifier
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - AUTO_START=true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - twitter-network

networks:
  twitter-network:
    name: twitter-network
    driver: bridge

